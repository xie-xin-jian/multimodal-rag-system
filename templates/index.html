<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23262624'/%3E%3Cpath d='M4 5h8M4 8h5M4 11h7' stroke='%23fcfcfb' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Mini RAG Workspace</title>
<script>
(() => {
  try {
    const saved = localStorage.getItem('mini-rag-theme');
    const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : preferred;
  } catch (_) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>

    border-radius: 8px;
  }

  .modal-info-row {
    display: grid;
    grid-template-columns: minmax(100px, 0.8fr) minmax(0, 1.2fr);
    gap: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-secondary);
    font-size: 11px;
  }

  .modal-info-row:last-child {
    border-bottom: 0;
  }

  .modal-info-row span:first-child {
    color: var(--text-tertiary);
  }

  .modal-info-row span:last-child {
    overflow-wrap: anywhere;
    color: var(--text-secondary);
    text-align: right;
  }

  .toast-stack {
    position: fixed;
    z-index: 100;
    right: 18px;
    bottom: 18px;
    display: grid;
    width: min(360px, calc(100vw - 36px));
    gap: 7px;
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 11px;
    color: var(--text-primary);
    background: var(--bg-elevated);
    border: 1px solid var(--border-primary);
    border-radius: 9px;
    box-shadow: var(--shadow-floating);
    font-size: 11px;
    line-height: 1.55;
    pointer-events: auto;
    animation: toast-in 160ms ease-out;
  }

  @keyframes toast-in {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .toast .icon {
    margin-top: 1px;
  }

  .toast.is-success .icon {
    color: var(--success-text);
  }

  .toast.is-warning .icon {
    color: var(--warning-text);
  }

  .toast.is-error .icon {
    color: var(--danger-text);
  }

  .toast.is-info .icon {
    color: var(--info-text);
  }

  .toast-copy {
    min-width: 0;
    flex: 1;
    overflow-wrap: anywhere;
  }

  .toast-close {
    display: grid;
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    place-items: center;
    padding: 0;
    color: var(--text-tertiary);
    background: transparent;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
  }

  .toast-close:hover {
    color: var(--text-primary);
    background: var(--bg-hover);
  }

  @media (max-width: 1180px) {
    .workspace-page {
      padding: 30px 28px 44px;
    }

    .split-view {
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.8fr);
    }
  }

  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      z-index: 50;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(86vw, 300px);
      min-width: 0;
      transform: translateX(-100%);
      transition: transform 180ms ease;
    }

    .sidebar.mobile-open {
      transform: translateX(0);
    }

    .sidebar-backdrop.visible {
      display: block;
    }

    .mobile-bar {
      display: flex;
    }

    .workspace-page {
      padding: 24px 20px 40px;
    }

    .workspace-header {
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .workspace-actions {
      width: 100%;
      justify-content: flex-start;
    }

    .split-view {
      grid-template-columns: minmax(0, 1fr);
    }

    .detail-panel {
      position: static;
    }

    .workspace-table {
      min-width: 540px;
    }
  }

  @media (max-width: 640px) {
    .chat-column {
      width: calc(100% - 28px);
    }

    .chat-empty {
      padding-right: 16px;
      padding-left: 16px;
    }

    .chat-empty h1 {
      font-size: 20px;
    }

    .message-list {
      gap: 18px;
      padding-top: 22px;
    }

    .user-bubble {
      max-width: 88%;
    }

    .composer-shell {
      padding: 8px 10px 12px;
    }

    .composer-option.project-option {
      max-width: 145px;
    }

    .composer-hint {
      display: none;
    }

    .approval-region {
      right: 10px;
      bottom: 102px;
      left: 10px;
    }

    .approval-region.is-management {
      bottom: 12px;
    }

    .approval-card {
      padding: 12px;
    }

    .approval-steps {
      margin-left: 0;
    }

    .workspace-page {
      padding: 20px 14px 34px;
    }

    .workspace-title {
      font-size: 19px;
    }

    .workspace-toolbar {
      flex-wrap: wrap;
    }

    .toolbar-search {
      width: 100%;
    }

    .toolbar-spacer {
      display: none;
    }

    .toolbar-select {
      flex: 1;
    }

    .upload-strip-copy {
      display: none;
    }

    .upload-strip .btn span {
      display: none;
    }

    .toast-stack {
      right: 10px;
      bottom: 10px;
      width: calc(100vw - 20px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

function createIcon(symbolId, className = 'icon') {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', className);
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${symbolId}`);
  svg.appendChild(use);
  return svg;
}

function createElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = String(text);
  return element;
}

function formatCompactNumber(value) {
  const number = Number(value) || 0;
  const absolute = Math.abs(number);
  if (absolute < 1000) return String(number);
  if (absolute < 1000000) {
    return `${Number((number / 1000).toFixed(absolute < 100000 ? 1 : 0))}k`;
  }
  if (absolute < 1000000000) {
    return `${Number((number / 1000000).toFixed(absolute < 100000000 ? 1 : 0))}m`;
  }
  return `${Number((number / 1000000000).toFixed(1))}b`;
}

function formatVersion(value) {
  return value === null || value === undefined || value === '' ? '--' : `v${formatCompactNumber(value)}`;
}

function formatBytes(value) {
  const bytes = Number(value) || 0;
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function formatDate(value) {
  if (!value) return '--';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
}

function formatDuration(milliseconds) {
  const seconds = Math.max(0, milliseconds) / 1000;
  return seconds < 60 ? `${seconds.toFixed(1)}s` : `${Math.floor(seconds / 60)}m ${(seconds % 60).toFixed(0)}s`;
}

function statusBadge(state) {
  const [label, kind] = statusLabels[state] || [state || '未知', 'neutral'];
  return createElement('span', `badge badge-${kind}`, label);
}

function setButtonBusy(button, busy) {
  if (!button) return;
  button.disabled = Boolean(busy);
  button.setAttribute('aria-busy', busy ? 'true' : 'false');
  button.classList.toggle('is-loading', Boolean(busy));
}

async function requestJSON(url, options = {}) {
  const response = await fetch(url, options);
  const contentType = response.headers.get('content-type') || '';
  let data = {};
  if (contentType.includes('application/json')) {
    data = await response.json();
  } else {
    const text = await response.text();
    data = text ? { error: text } : {};
  }
  if (!response.ok || data.error) {
    throw new Error(data.error || `请求失败 (${response.status})`);
  }
  return data;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function renderInlineMarkdown(value) {
  let text = escapeHtml(value);
  const codeTokens = [];
  text = text.replace(/`([^`\n]+)`/g, (_, code) => {
    const token = `\uE000${codeTokens.length}\uE001`;
    codeTokens.push(`<code>${code}</code>`);
    return token;
  });
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
    const decodedHref = href.replaceAll('&amp;', '&');
    if (!/^(https?:\/\/|mailto:|\/|#)/i.test(decodedHref)) return label;
    const external = /^https?:\/\//i.test(decodedHref);
    return `<a href="${href}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${label}</a>`;
  });
  text = text.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  text = text.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  codeTokens.forEach((code, index) => {
    text = text.replace(`\uE000${index}\uE001`, code);
  });
  return text;
}

function splitTableRow(line) {
  let value = line.trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  return value.split('|').map((cell) => cell.trim());
}

function isTableSeparator(line) {
  const cells = splitTableRow(line);
  return cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
}

function isBlockStart(lines, index) {
  const line = lines[index];
  if (line === undefined) return true;
  return (
    /^\s*$/.test(line) ||
    /^```/.test(line) ||
    /^#{1,6}\s+/.test(line) ||
    /^>\s?/.test(line) ||
    /^\s*[-*+]\s+/.test(line) ||
    /^\s*\d+\.\s+/.test(line) ||
    /^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line) ||
    (line.includes('|') && isTableSeparator(lines[index + 1] || ''))
  );
}

function renderMarkdown(source) {
  const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n');
  const html = [];
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    if (/^\s*$/.test(line)) {
      index += 1;
      continue;
    }

    const fence = line.match(/^```([^\s`]*)\s*$/);
    if (fence) {
      const language = fence[1] || 'text';
      const codeLines = [];
      index += 1;
      while (index < lines.length && !/^```\s*$/.test(lines[index])) {
        codeLines.push(lines[index]);
        index += 1;
      }
      if (index < lines.length) index += 1;
      html.push(
        `<div class="code-block"><div class="code-toolbar"><span>${escapeHtml(language)}</span>` +
          `<button class="copy-code-button" type="button" data-copy-code>${createIconMarkup('icon-copy')}复制</button></div>` +
          `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre></div>`,
      );
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      const level = heading[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
      index += 1;
      continue;
    }

    if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
      html.push('<hr>');
      index += 1;
      continue;
    }

    if (line.includes('|') && isTableSeparator(lines[index + 1] || '')) {
      const headers = splitTableRow(line);
      index += 2;
      const rows = [];
      while (index < lines.length && lines[index].includes('|') && !/^\s*$/.test(lines[index])) {
        rows.push(splitTableRow(lines[index]));
        index += 1;
      }
      const head = headers.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join('');
      const body = rows
        .map((row) => `<tr>${headers.map((_, cellIndex) => `<td>${renderInlineMarkdown(row[cellIndex] || '')}</td>`).join('')}</tr>`)
        .join('');
      html.push(`<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
      continue;
    }

    if (/^>\s?/.test(line)) {
      const quote = [];
      while (index < lines.length && /^>\s?/.test(lines[index])) {
        quote.push(lines[index].replace(/^>\s?/, ''));
        index += 1;
      }
      html.push(`<blockquote>${quote.map(renderInlineMarkdown).join('<br>')}</blockquote>`);
      continue;
    }

    const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
    const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
    if (unordered || ordered) {
      const orderedList = Boolean(ordered);
      const items = [];
      while (index < lines.length) {
        const match = orderedList
          ? lines[index].match(/^\s*\d+\.\s+(.+)$/)
          : lines[index].match(/^\s*[-*+]\s+(.+)$/);
        if (!match) break;
        items.push(`<li>${renderInlineMarkdown(match[1])}</li>`);
        index += 1;
      }
      html.push(orderedList ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      continue;
    }

    const paragraph = [line];
    index += 1;
    while (index < lines.length && !isBlockStart(lines, index)) {
      paragraph.push(lines[index]);
      index += 1;
    }
    html.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`);
  }
  return `<div class="markdown">${html.join('')}</div>`;
}

function createIconMarkup(symbolId) {
  return `<svg class="icon" aria-hidden="true"><use href="#${symbolId}"></use></svg>`;
}

function updateEmptyState() {
  const hasMessages = Boolean(elements.messageList.querySelector('.message, .activity-group'));
  elements.chatEmpty.hidden = hasMessages;
}

function scrollChatToBottom() {
  window.requestAnimationFrame(() => {
    elements.chatScroll.scrollTop = elements.chatScroll.scrollHeight;
  });
}

function addMessage(role, text, sources = []) {
  const message = createElement('div', `message message-${role}`);
  if (role === 'user') {
    message.appendChild(createElement('div', 'user-bubble', text));
  } else if (role === 'error') {
    const content = createElement('div', 'message-content markdown');
    content.appendChild(createElement('p', '', String(text ?? '')));
    message.appendChild(content);
  } else {
    const content = createElement('div', 'message-content');
    content.innerHTML = renderMarkdown(text);
    if (Array.isArray(sources) && sources.length > 0) {
      const sourceBox = createElement('div', 'sources');
      sources.forEach((source) => sourceBox.appendChild(createElement('span', 'source-tag', source)));
      content.appendChild(sourceBox);
    }
    message.appendChild(content);
  }
  elements.messageList.appendChild(message);
  updateEmptyState();
  scrollChatToBottom();
  return message;
}

function outputPreview(text) {
  const lines = String(text ?? '').split('\n');
  if (lines.length <= 6) return lines.join('\n');
  return [...lines.slice(0, 4), '…', ...lines.slice(-2)].join('\n');
}

function createActivityGroup(title, container = elements.messageList) {
  const root = createElement('div', 'activity-group');
  root.dataset.state = 'running';
  const summary = createElement('button', 'activity-summary');
  summary.type = 'button';
  summary.setAttribute('aria-expanded', 'false');
  summary.appendChild(createElement('span', 'status-dot'));
  summary.appendChild(createElement('span', 'activity-title', title));
  const meta = createElement('span', 'activity-meta', '0 个步骤 · 0.0s');
  const latest = createElement('span', 'activity-latest', '准备执行');
  summary.append(meta, latest, createIcon('icon-chevron'));

  const body = createElement('div', 'activity-body');
  body.hidden = true;
  root.append(summary, body);
  container.appendChild(root);

  const activity = {
    root,
    summary,
    meta,
    latest,
    body,
    steps: [],
    startedAt: performance.now(),
    timer: null,
  };

  summary.addEventListener('click', () => {
    const expanded = root.classList.toggle('expanded');
    body.hidden = !expanded;
    summary.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  });

  activity.timer = window.setInterval(() => {
    activity.meta.textContent = `${activity.steps.length} 个步骤 · ${formatDuration(performance.now() - activity.startedAt)}`;
  }, 300);

  if (container === elements.messageList) {
    updateEmptyState();
    scrollChatToBottom();
  }
  return activity;
}

function appendActivityStep(activity, { name, args = '', output = '', status = 'running' }) {
  let currentOutput = output;
  const step = createElement('div', 'activity-step');
  step.dataset.state = status;
  const summary = createElement('button', 'step-summary');
  summary.type = 'button';
  summary.setAttribute('aria-expanded', 'false');
  summary.append(createElement('span', 'status-dot'), createElement('span', 'step-name', name));
  const duration = createElement('span', 'step-duration', status === 'running' ? '执行中' : '');
  summary.append(duration, createIcon('icon-chevron'));

  const details = createElement('div', 'step-details');
  details.hidden = true;
  const argsBlock = createElement('pre', 'step-code', String(args || '无参数'));
  const outputBlock = createElement('pre', 'step-code', outputPreview(currentOutput || '等待输出'));
  const outputToggle = createElement('button', 'btn btn-ghost output-toggle', '展开完整输出');
  outputToggle.type = 'button';
  let outputExpanded = false;
  const outputTools = createElement('div', 'output-tools');
  outputTools.appendChild(outputToggle);
  details.append(
    createElement('div', 'step-field-label', '参数'),
    argsBlock,
    createElement('div', 'step-field-label', '输出'),
    outputBlock,
    outputTools,
  );
  step.append(summary, details);
  activity.body.appendChild(step);

  summary.addEventListener('click', () => {
    const expanded = step.classList.toggle('expanded');
    details.hidden = !expanded;
    summary.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  });

  outputToggle.addEventListener('click', () => {
    outputExpanded = !outputExpanded;
    outputBlock.textContent = outputExpanded
      ? currentOutput || '无输出'
      : outputPreview(currentOutput || '无输出');
    outputToggle.textContent = outputExpanded ? '收起输出' : '展开完整输出';
  });

  const record = {
    root: step,
    duration,
    outputBlock,
    outputToggle,
    setOutput: (nextOutput) => {
      currentOutput = nextOutput;
      outputExpanded = false;
      outputBlock.textContent = outputPreview(currentOutput || '无输出');
      outputToggle.textContent = '展开完整输出';
    },
    setOutputExpanded: (expanded) => {
      outputExpanded = expanded;
      outputBlock.textContent = expanded
        ? currentOutput || '无输出'
        : outputPreview(currentOutput || '无输出');
      outputToggle.textContent = expanded ? '收起输出' : '展开完整输出';
    },
    startedAt: performance.now(),
    finishedAt: null,
  };
  activity.steps.push(record);
  activity.latest.textContent = name;
  activity.meta.textContent = `${activity.steps.length} 个步骤 · ${formatDuration(performance.now() - activity.startedAt)}`;
  return record;
}

function updateActivityStep(step, { status, output }) {
  step.root.dataset.state = status;
  if (output !== undefined) {
    step.setOutput(output);
  }
  step.finishedAt = performance.now();
  step.duration.textContent = formatDuration(step.finishedAt - step.startedAt);
}

function finishActivity(activity, state = 'complete', latestText = '') {
  window.clearInterval(activity.timer);
  activity.root.dataset.state = state;
  activity.meta.textContent = `${activity.steps.length} 个步骤 · ${formatDuration(performance.now() - activity.startedAt)}`;
  if (latestText) activity.latest.textContent = latestText;
}

function positionApprovalRegion() {
  if (appState.activeView !== 'chat' || elements.approvalRegion.childElementCount === 0) return;
  const composer = document.querySelector('.composer-shell');
  if (composer) {
    elements.approvalRegion.style.bottom = `${composer.offsetHeight + 12}px`;
  }
}

function dismissApproval() {
  elements.approvalRegion.replaceChildren();
}

function requestApproval({ title, risk, impact, steps, confirmLabel, danger = false, onApprove }) {
  dismissApproval();
  const card = createElement('section', 'approval-card');
  card.setAttribute('role', 'alertdialog');
  card.setAttribute('aria-label', title);

  const head = createElement('div', 'approval-head');
  const icon = createElement('div', 'approval-icon');
  icon.appendChild(createIcon('icon-alert'));
  const copy = createElement('div', 'approval-copy');
  const titleRow = createElement('div', 'approval-title-row');
  titleRow.appendChild(createElement('h2', 'approval-title', title));
  titleRow.appendChild(createElement('span', `badge ${danger ? 'badge-danger' : 'badge-warning'}`, risk));
  copy.append(titleRow, createElement('p', 'approval-description', impact));
  head.append(icon, copy);

  const stepList = createElement('ol', 'approval-steps');
  (steps || []).forEach((step, index) => {
    const item = createElement('li');
    item.append(createElement('span', '', String(index + 1).padStart(2, '0')), createElement('span', '', step));
    stepList.appendChild(item);
  });

  const error = createElement('div', 'approval-error');
  error.hidden = true;
  const actions = createElement('div', 'approval-actions');
  const reject = createElement('button', 'btn btn-secondary', '拒绝');
  reject.type = 'button';
  const approve = createElement('button', `btn ${danger ? 'btn-danger' : 'btn-primary'}`, confirmLabel);
  approve.type = 'button';
  actions.append(reject, approve);
  card.append(head, stepList, error, actions);
  elements.approvalRegion.appendChild(card);
  positionApprovalRegion();
  window.requestAnimationFrame(() => approve.focus());

  reject.addEventListener('click', dismissApproval);
  approve.addEventListener('click', async () => {
    setButtonBusy(approve, true);
    reject.disabled = true;
    error.hidden = true;
    try {
      await onApprove();
      dismissApproval();
    } catch (approvalError) {
      error.textContent = approvalError.message;
      error.hidden = false;
    } finally {
      reject.disabled = false;
      setButtonBusy(approve, false);
    }
  });
}

function openModal({ title, description = '', content, actions = [] }) {
  appState.lastFocus = document.activeElement;
  elements.modalTitle.textContent = title;
  elements.modalDescription.textContent = description;
  elements.modalDescription.hidden = !description;
  elements.modalBody.replaceChildren();
  if (content instanceof Node) {
    elements.modalBody.appendChild(content);
  } else if (content) {
    elements.modalBody.textContent = String(content);
  }
  elements.modalFooter.replaceChildren();
  actions.forEach((action) => {
    const button = createElement('button', `btn ${action.className || 'btn-secondary'}`, action.label);
    button.type = 'button';
    button.addEventListener('click', () => action.onClick || closeModal());
    elements.modalFooter.appendChild(button);
  });
  if (actions.length === 0) {
    const close = createElement('button', 'btn btn-primary', '关闭');
    close.type = 'button';
    close.addEventListener('click', closeModal);
    elements.modalFooter.appendChild(close);
  }
  elements.modalBackdrop.hidden = false;
  window.requestAnimationFrame(() => elements.modal.focus());
}

function closeModal() {
  if (elements.modalBackdrop.hidden) return;
  elements.modalBackdrop.hidden = true;
  elements.modalBody.replaceChildren();
  elements.modalFooter.replaceChildren();

function updateStatusUI() {

  const loaded = Boolean(status?.loaded);
  elements.serviceDot.classList.toggle('is-online', loaded);
  elements.serviceDot.classList.toggle('is-offline', !loaded);

  document.getElementById('nav-release-count').textContent = formatCompactNumber(appState.releases.length);
  document.getElementById('tree-doc-count').textContent = formatCompactNumber(appState.documents.length);

function updateSendState() {
  const hasQuery = Boolean(elements.queryInput.value.trim());
  const loaded = Boolean(appState.status?.loaded);
  if (appState.isSending) {
    elements.sendStopButton.disabled = false;
    elements.sendStopButton.classList.add('is-stop');
    elements.sendStopButton.setAttribute('aria-label', '停止生成');
    elements.sendIconUse.setAttribute('href', '#icon-stop');
  } else {
    elements.sendStopButton.disabled = !hasQuery || !loaded;
    elements.sendStopButton.classList.remove('is-stop');
    elements.sendStopButton.setAttribute('aria-label', '发送');
    elements.sendIconUse.setAttribute('href', '#icon-arrow-up');

async function loadStatus() {
  appState.status = await requestJSON('/api/status');
  updateStatusUI();
  return appState.status;
}

async function loadDocuments() {
  const documents = await requestJSON('/api/documents');
  appState.documents = Array.isArray(documents) ? documents : [];
  renderDocuments();
}

async function loadReleases() {
  const releases = await requestJSON('/api/releases');
  appState.releases = Array.isArray(releases) ? releases : [];
  renderReleases();
}

async function refreshData({ quiet = true } = {}) {
  const results = await Promise.allSettled([loadStatus(), loadDocuments(), loadReleases()]);
  const failed = results.find((result) => result.status === 'rejected');
  if (failed) {
    showToast(`刷新失败：${failed.reason.message}`, 'error');
  } else if (!quiet) {
    showToast('工作区已刷新', 'success');
  }
  updateStatusUI();
}

function documentKey(documentItem) {
  return documentItem.doc_id || documentItem.file || documentItem.name;
}

function createWorkspaceEmpty(iconId, title, text) {
  const empty = createElement('div', 'workspace-empty');
  const inner = createElement('div', 'workspace-empty-inner');
  inner.appendChild(createIcon(iconId));
  inner.appendChild(createElement('h3', 'workspace-empty-title', title));
  if (text) inner.appendChild(createElement('p', 'workspace-empty-text', text));
  empty.appendChild(inner);
  return empty;
}

function filteredDocuments() {
  const search = appState.documentSearch.trim().toLowerCase();
  if (!search) return appState.documents;
  return appState.documents.filter((documentItem) =>
    `${documentItem.name} ${documentItem.doc_id} ${documentItem.file}`.toLowerCase().includes(search),
  );
}

function renderDocuments() {
  const documents = filteredDocuments();
  elements.docTableBody.replaceChildren();
  elements.docListMeta.textContent = `${documents.length} 项`;
  elements.docListEmpty.replaceChildren();

  if (appState.documents.length === 0) {
    elements.docListEmpty.appendChild(
      createWorkspaceEmpty('icon-library', '知识库还没有文档', '添加 PDF、Markdown、TXT 或 DOCX 文档后开始提问。'),
    );
  } else if (documents.length === 0) {
    elements.docListEmpty.appendChild(createWorkspaceEmpty('icon-search', '没有匹配的文档', '尝试缩短搜索词。'));
  } else {
    const selectedStillVisible = documents.some(
      (documentItem) => documentKey(documentItem) === appState.selectedDocumentKey,
    );
    if (!selectedStillVisible) appState.selectedDocumentKey = documentKey(documents[0]);
  }

  documents.forEach((documentItem) => {
    const key = documentKey(documentItem);
    const row = document.createElement('tr');
    row.classList.toggle('is-selected', key === appState.selectedDocumentKey);
    row.tabIndex = 0;
    row.setAttribute('aria-selected', key === appState.selectedDocumentKey ? 'true' : 'false');

    const nameCell = document.createElement('td');
    const primary = createElement('div', 'table-primary');
    primary.append(createIcon('icon-file'), createElement('span', 'table-primary-text', documentItem.name));
    nameCell.appendChild(primary);

    const chunksCell = createElement('td', 'table-mono', formatCompactNumber(documentItem.chunk_count));
    const sizeCell = createElement('td', 'table-mono', formatBytes(documentItem.size));
    row.append(nameCell, chunksCell, sizeCell);
    const select = () => {
      appState.selectedDocumentKey = key;
      renderDocuments();
    };
    row.addEventListener('click', select);
    row.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select();
      }
    });
    elements.docTableBody.appendChild(row);
  });
  renderDocumentDetail();
}

function detailRow(label, value, mono = false) {
  const row = createElement('div', 'detail-row');
  row.append(createElement('dt', '', label), createElement('dd', mono ? 'mono' : '', value ?? '--'));

function filteredReleases() {
  const search = appState.releaseSearch.trim().toLowerCase();
  return appState.releases.filter((release) => {
    const statusMatch = appState.releaseFilter === 'all' || release.state === appState.releaseFilter;
    const text = `${release.id} ${release.state} ${release.release_mode || ''} ${release.error || ''}`.toLowerCase();
    return statusMatch && (!search || text.includes(search));
  });
}

async function waitForJob(jobId, onUpdate) {
  const startedAt = Date.now();
  const timeoutMs = 180000;
  while (Date.now() - startedAt < timeoutMs) {
    const job = await requestJSON(`/api/jobs/${encodeURIComponent(jobId)}`);
    if (onUpdate) onUpdate(job);
    if (['ACTIVE', 'FAILED', 'NOOP', 'REJECTED'].includes(job.state)) return job;
    await new Promise((resolve) => window.setTimeout(resolve, 800));
  }
  throw new Error('任务等待超时');
}

function jobOperationLabel(job) {
  const labels = { UPLOAD: '发布知识库', DELETE: '删除文档', ROLLBACK: '切换发布版本' };
  return labels[job?.operation] || '处理知识库任务';
}

function createJobActivity(container, job, label) {
  container.replaceChildren();
  const activity = createActivityGroup(label || jobOperationLabel(job), container);
  const step = appendActivityStep(activity, {
    name: jobOperationLabel(job),
    args: JSON.stringify({
      release_id: job.release_id,
      operation: job.operation,
      attempts: job.attempts,
    }, null, 2),
    output: `任务 ${job.id} · ${job.state}`,
  });
  return { activity, step };
}

function updateJobActivity(record, job) {
  const terminal = ['ACTIVE', 'FAILED', 'NOOP', 'REJECTED'].includes(job.state);
  const stateMap = {
    ACTIVE: 'complete',
    FAILED: 'error',
    REJECTED: 'error',
    NOOP: 'cancelled',
  };
  if (terminal) {
    updateActivityStep(record.step, {
      status: stateMap[job.state] || 'complete',
      output: job.error || `任务状态：${job.state}\n任务 ID：${job.id}`,
    });
    finishActivity(
      record.activity,
      stateMap[job.state] || 'complete',
      statusLabels[job.state]?.[0] || job.state,
    );
  } else {
    record.activity.latest.textContent = `${jobOperationLabel(job)} · ${statusLabels[job.state]?.[0] || job.state}`;
  }
}

async function uploadFiles(files) {
  if (!files || files.length === 0 || appState.uploadBusy) return;
  appState.uploadBusy = true;
  elements.uploadStrip.classList.add('is-busy');
  setButtonBusy(elements.uploadStripButton, true);
  clearNotice(elements.knowledgeNotice);
  const formData = new FormData();
  Array.from(files).forEach((file) => formData.append('files', file));
  try {
    const data = await requestJSON('/api/ingest', { method: 'POST', body: formData });
    if (!data.job) throw new Error('服务没有返回发布任务');
    showToast(`已提交 ${data.files?.length || files.length} 个文件`, 'info');
    const record = createJobActivity(
      elements.knowledgeOperation,
      data.job,
      `发布 ${data.files?.length || files.length} 个文档`,
    );
    const job = await waitForJob(data.job.id, (nextJob) => updateJobActivity(record, nextJob));
    updateJobActivity(record, job);
    if (job.state === 'ACTIVE') {
      showNotice(elements.knowledgeNotice, 'success', '发布完成', `活动版本已更新为 ${formatVersion(job.release_id)}。`);
    } else if (job.state === 'NOOP') {
      showNotice(elements.knowledgeNotice, 'info', '没有需要发布的变化', '文档内容与索引配置均未变化。');
    } else {
      showNotice(elements.knowledgeNotice, 'error', '发布未完成', job.error || `任务状态：${job.state}`);
    }
    await refreshData();
  } catch (error) {
    showNotice(elements.knowledgeNotice, 'error', '上传失败', error.message);
    showToast(error.message, 'error');
  } finally {
    appState.uploadBusy = false;
    elements.uploadStrip.classList.remove('is-busy');
    setButtonBusy(elements.uploadStripButton, false);
    elements.fileInput.value = '';
  }
}

function confirmDeleteDocument(documentItem) {
  requestApproval({
    title: `删除“${documentItem.name}”`,
    risk: '需要确认',
    impact: '删除会创建新的知识库版本，并从活动索引中移除该文档。历史版本仍按保留策略管理。',
    steps: ['创建删除任务', '构建不包含该文档的新索引', '验证后切换活动版本'],
    confirmLabel: '确认删除',
    danger: true,
    onApprove: async () => {
      showNotice(elements.knowledgeNotice, 'info', '正在提交删除任务', documentItem.name);
      const data = await requestJSON('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: documentItem.file }),
      });
      if (!data.job) throw new Error('服务没有返回删除任务');
      const record = createJobActivity(elements.knowledgeOperation, data.job, `删除 ${documentItem.name}`);
      const job = await waitForJob(data.job.id, (nextJob) => updateJobActivity(record, nextJob));
      updateJobActivity(record, job);
      if (job.state !== 'ACTIVE' && job.state !== 'NOOP') {
        throw new Error(job.error || `删除失败：${job.state}`);
      }
      showNotice(
        elements.knowledgeNotice,
        'success',
        job.state === 'NOOP' ? '文档已不在活动版本中' : '文档已删除',
        documentItem.name,
      );
      showToast(job.state === 'NOOP' ? '文档没有发生变化' : '文档删除已发布', 'success');
      await refreshData();
    },
  });
}

function confirmRollback(release) {
  requestApproval({
    title: `回滚到 ${formatVersion(release.id)}`,
    risk: '影响检索',
    impact: '活动知识库将切换到此历史版本。当前版本会保留为历史版本，后续仍可再次切换。',
    steps: ['加载历史索引', '校验版本记录', '原子切换活动版本'],
    confirmLabel: '确认回滚',
    danger: false,
    onApprove: async () => {
      showNotice(elements.releaseNotice, 'info', '正在提交回滚任务', `目标版本 ${formatVersion(release.id)}`);
      const data = await requestJSON('/api/rollback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ release_id: release.id }),
      });
      if (!data.job) throw new Error('服务没有返回回滚任务');
      const record = createJobActivity(elements.releaseOperation, data.job, `回滚到 ${formatVersion(release.id)}`);
      const job = await waitForJob(data.job.id, (nextJob) => updateJobActivity(record, nextJob));
      updateJobActivity(record, job);
      if (job.state !== 'ACTIVE' && job.state !== 'NOOP') {
        throw new Error(job.error || `回滚失败：${job.state}`);
      }
      showNotice(elements.releaseNotice, 'success', '版本切换完成', `当前版本 ${formatVersion(release.id)}。`);
      showToast('发布版本已切换', 'success');
      await refreshData();
    },
  });
}

async function runReconciliation(view) {
  const notice = view === 'releases' ? elements.releaseNotice : elements.knowledgeNotice;
  const operation = view === 'releases' ? elements.releaseOperation : elements.knowledgeOperation;
  const button = document.getElementById(
    view === 'releases' ? 'release-reconcile-button' : 'knowledge-reconcile-button',
  );
  setButtonBusy(button, true);
  clearNotice(notice);
  try {
    const data = await requestJSON('/api/reconcile', { method: 'POST' });
    if (!data.changed || !data.job) {
      showNotice(notice, 'info', '对账完成', '没有发现需要发布的外部文件变化。');
      showToast('没有发现文件变化', 'info');
      return;
    }
    const record = createJobActivity(operation, data.job, '处理外部文件变化');
    const job = await waitForJob(data.job.id, (nextJob) => updateJobActivity(record, nextJob));
    updateJobActivity(record, job);
    if (job.state === 'ACTIVE') {
      showNotice(notice, 'success', '对账发布完成', `活动版本 ${formatVersion(job.release_id)}。`);
    } else if (job.state === 'NOOP') {
      showNotice(notice, 'info', '外部文件无有效变化', '任务已跳过发布。');
    } else {
      showNotice(notice, 'error', '对账任务未完成', job.error || `任务状态：${job.state}`);
    }
    await refreshData();
  } catch (error) {
    showNotice(notice, 'error', '对账失败', error.message);
    showToast(error.message, 'error');
  } finally {
    setButtonBusy(button, false);
  }
}

async function sendMessage() {
  const query = elements.queryInput.value.trim();
  if (!query || appState.isSending || !appState.status?.loaded) return;

  appState.isSending = true;
  appState.abortController = new AbortController();
  elements.queryInput.value = '';
  elements.queryInput.style.height = 'auto';
  updateSendState();
  addMessage('user', query);
  const activity = createActivityGroup('检索并生成回答');
  const step = appendActivityStep(activity, {
    name: '检索知识库并生成回答',
    args: JSON.stringify({ query, use_query_expansion: appState.useExpansion }, null, 2),
    output: '正在检索候选上下文',
  });

  try {
    const data = await requestJSON('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, use_query_expansion: appState.useExpansion }),
      signal: appState.abortController.signal,
    });
    updateActivityStep(step, {
      status: 'complete',
      output: `使用 ${data.contexts_used || 0} 条上下文\n来源：${(data.sources || []).join(', ') || '无'}`,
    });
    finishActivity(activity, 'complete', '回答已生成');
    addMessage('assistant', data.answer, data.sources || []);
    refreshData();
  } catch (error) {
    if (error.name === 'AbortError') {
      updateActivityStep(step, { status: 'cancelled', output: '用户停止了前端等待。' });
      finishActivity(activity, 'cancelled', '已停止');
      showToast('已停止等待回答', 'info');
    } else {
      updateActivityStep(step, { status: 'error', output: error.message });
      finishActivity(activity, 'error', '执行失败');
      addMessage('error', error.message);
    }
  } finally {
    appState.isSending = false;
    appState.abortController = null;
    updateSendState();
    elements.queryInput.focus();
  }
}

function stopSending() {
  if (appState.abortController) appState.abortController.abort();
}

async function retryLatestJobIfPossible() {
  const job = appState.status?.latest_job;
  if (!job || !['FAILED', 'REJECTED'].includes(job.state)) return;
  const button = document.querySelector('[data-retry-job]');
  setButtonBusy(button, true);
  try {
    const data = await requestJSON(`/api/jobs/${encodeURIComponent(job.id)}/retry`, { method: 'POST' });
    showToast('任务已重新排队', 'info');
    const jobResult = await waitForJob(data.job.id);
    showToast(`任务结束：${statusLabels[jobResult.state]?.[0] || jobResult.state}`, jobResult.state === 'ACTIVE' ? 'success' : 'warning');
    await refreshData();
  } catch (error) {
    showToast(error.message, 'error');
  } finally {
    setButtonBusy(button, false);
  }
}

function openJobModal() {
  const status = appState.status;
  const job = status?.latest_job;
  const actions = [];
  const content = document.createElement('div');
  content.appendChild(
    buildInfoGrid([
      ['服务', status?.loaded ? '知识库可用' : '知识库未加载'],
      ['任务状态', job ? statusLabels[job.state]?.[0] || job.state : '空闲'],
      ['任务操作', job?.operation || '--'],
      ['任务 ID', job?.id || '--'],
      ['尝试次数', job?.attempts ?? '--'],
      ['错误', job?.error || '--'],
      ['最近对账', status?.reconciliation?.state || '--'],
      ['对账时间', formatDate(status?.reconciliation?.last_run_at)],
    ]),
  );
  if (job && ['FAILED', 'REJECTED'].includes(job.state)) {
    actions.push({
      label: '重试任务',
      className: 'btn-primary',
      onClick: async () => {
        closeModal();
        await retryLatestJobIfPossible();
      },
    });
  }
  openModal({
    title: '服务与任务状态',
    description: '状态直接来自知识库发布服务。',
    content,
    actions,
  });
}

function bindEvents() {
  document.querySelectorAll('[data-view]').forEach((button) => {
    button.addEventListener('click', () => setView(button.dataset.view));
  });
  elements.newChatButton.addEventListener('click', resetConversation);
  elements.clearChatButton.addEventListener('click', resetConversation);
  elements.menuButton.addEventListener('click', () => setSidebarOpen(true));
  elements.sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
  elements.workspaceToggle.addEventListener('click', () => {
    const expanded = elements.workspaceToggle.getAttribute('aria-expanded') !== 'false';
    elements.workspaceToggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
    elements.workspaceChildren.hidden = expanded;
  });
  elements.themeButton.addEventListener('click', toggleTheme);
  elements.serviceButton.addEventListener('click', openJobModal);
  elements.projectContextButton.addEventListener('click', openSystemModal);
  elements.expansionToggle.addEventListener('click', () => {
    appState.useExpansion = !appState.useExpansion;
    elements.expansionToggle.classList.toggle('is-on', appState.useExpansion);
    elements.expansionToggle.setAttribute('aria-pressed', appState.useExpansion ? 'true' : 'false');
  });
  elements.sendStopButton.addEventListener('click', () => {
    if (appState.isSending) stopSending();
    else sendMessage();
  });
  elements.queryInput.addEventListener('input', () => {
    elements.queryInput.style.height = 'auto';
    elements.queryInput.style.height = `${Math.min(elements.queryInput.scrollHeight, 200)}px`;
    updateSendState();
  });
  elements.queryInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      if (!appState.isSending) sendMessage();
    }
  });
  elements.docSearch.addEventListener('input', () => {
    appState.documentSearch = elements.docSearch.value;
    renderDocuments();
  });
  elements.releaseSearch.addEventListener('input', () => {
    appState.releaseSearch = elements.releaseSearch.value;
    renderReleases();
  });
  elements.releaseFilter.addEventListener('change', () => {
    appState.releaseFilter = elements.releaseFilter.value;
    renderReleases();
  });
  document.getElementById('knowledge-refresh-button').addEventListener('click', (event) => {
    const button = event.currentTarget;
    setButtonBusy(button, true);
    refreshData({ quiet: false }).finally(() => setButtonBusy(button, false));
  });
  document.getElementById('release-refresh-button').addEventListener('click', (event) => {
    const button = event.currentTarget;
    setButtonBusy(button, true);
    refreshData({ quiet: false }).finally(() => setButtonBusy(button, false));
  });
  document.getElementById('knowledge-reconcile-button').addEventListener('click', () => runReconciliation('knowledge'));
  document.getElementById('release-reconcile-button').addEventListener('click', () => runReconciliation('releases'));
  document.getElementById('knowledge-upload-button').addEventListener('click', () => elements.fileInput.click());
  elements.fileInput.addEventListener('change', () => uploadFiles(elements.fileInput.files));
  elements.uploadStripButton.addEventListener('click', (event) => {
    event.stopPropagation();
    if (!appState.uploadBusy) elements.fileInput.click();
  });
  elements.uploadStrip.addEventListener('click', () => {
    if (!appState.uploadBusy) elements.fileInput.click();
  });
  elements.uploadStrip.addEventListener('keydown', (event) => {
    if ((event.key === 'Enter' || event.key === ' ') && !appState.uploadBusy) {
      event.preventDefault();
      elements.fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach((eventName) => {
    elements.uploadStrip.addEventListener(eventName, (event) => {
      event.preventDefault();
      elements.uploadStrip.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach((eventName) => {
    elements.uploadStrip.addEventListener(eventName, (event) => {
      event.preventDefault();
      elements.uploadStrip.classList.remove('dragover');
    });
  });
  elements.uploadStrip.addEventListener('drop', (event) => {
    uploadFiles(event.dataTransfer.files);
  });
  elements.modalCloseButton.addEventListener('click', closeModal);
  elements.modalBackdrop.addEventListener('click', (event) => {
    if (event.target === elements.modalBackdrop) closeModal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (!elements.modalBackdrop.hidden) closeModal();
      else dismissApproval();
    }
  });
  elements.messageList.addEventListener('click', async (event) => {
    const copyButton = event.target.closest('[data-copy-code]');
    if (!copyButton) return;
    const code = copyButton.closest('.code-block')?.querySelector('code')?.textContent || '';
    try {
      await navigator.clipboard.writeText(code);
      copyButton.lastChild.textContent = '已复制';
      window.setTimeout(() => {
        if (copyButton.lastChild) copyButton.lastChild.textContent = '复制';
      }, 1400);
    } catch (_) {
      showToast('无法访问剪贴板', 'warning');
    }
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) setSidebarOpen(false);
    positionApprovalRegion();
  });
}

async function init() {
  applyTheme(document.documentElement.dataset.theme);
  bindEvents();
  updateSendState();
  await refreshData();
  if (!appState.status?.loaded) {
    setView('chat');
  }
}

init();
</script>
</body>
</html>
