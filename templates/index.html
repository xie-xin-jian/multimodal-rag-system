<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini RAG System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #2f81f7;
    --accent-hover: #1f6feb;
    --green: #238636;
    --green-hover: #2ea043;
    --red: #da3633;
    --orange: #d29922;
    --radius: 8px;
  }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ---- 布局 ---- */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0;
  }

  /* ---- 侧边栏 ---- */
  .sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #2f81f7, #1f6feb);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff;
  }
  .sidebar-header h1 { font-size: 15px; font-weight: 600; }
  .sidebar-header .sub { font-size: 11px; color: var(--text-muted); }

  .sidebar-section {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h2 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted);
    margin-bottom: 10px;
  }

  .status-row {
    display: flex; justify-content: space-between;
    align-items: center; padding: 4px 0;
    font-size: 13px;
  }
  .status-row .label { color: var(--text-secondary); }
  .status-row .value { color: var(--text); font-family: monospace; }
  .badge-ok {
    background: var(--green); color: #fff;
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    font-weight: 600;
  }
  .badge-err {
    background: var(--red); color: #fff;
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    font-weight: 600;
  }

  /* ---- 上传区 ---- */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent);
    background: rgba(47, 129, 247, 0.05);
  }
  .upload-area .icon { font-size: 24px; margin-bottom: 6px; }
  .upload-area p { font-size: 12px; color: var(--text-secondary); }
  .upload-area .hint { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* ---- 文档列表 ---- */
  .doc-list { flex: 1; overflow-y: auto; }
  .doc-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--bg-tertiary);
    font-size: 13px;
  }
  .doc-item .file-icon { font-size: 14px; flex-shrink: 0; }
  .doc-item .name {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-item .size { font-size: 11px; color: var(--text-muted); }
  .doc-item .del-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 2px 4px;
    border-radius: 4px; transition: all 0.15s;
  }
  .doc-item .del-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

  /* ---- 主区域 ---- */
  .topbar {
    height: 52px; flex-shrink: 0;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px;
    gap: 12px;
  }
  .topbar .title { font-size: 14px; font-weight: 600; }
  .topbar .spacer { flex: 1; }

  .toggle-switch {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-secondary);
  }
  .toggle {
    position: relative; width: 36px; height: 20px;
    background: var(--bg-tertiary); border-radius: 20px;
    cursor: pointer; transition: background 0.2s;
    border: 1px solid var(--border);
  }
  .toggle.active { background: var(--green); border-color: var(--green); }
  .toggle::after {
    content: ""; position: absolute;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px;
    transition: left 0.2s;
  }
  .toggle.active::after { left: 18px; }

  /* ---- 聊天区 ---- */
  .chat-container {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 3px;
  }

  .msg {
    display: flex; gap: 12px; max-width: 85%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .msg.user .avatar { background: #1f6feb; color: #fff; }
  .msg.bot .avatar {
    background: linear-gradient(135deg, #2f81f7, #8957e5); color: #fff;
  }
  .msg .bubble {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    font-size: 14px; line-height: 1.7;
  }
  .msg.user .bubble { background: #1a3a5f; border-color: #2f6fb5; }

  .msg .bubble pre {
    background: var(--bg); border-radius: 6px;
    padding: 10px 14px; margin: 8px 0;
    overflow-x: auto; font-size: 13px;
  }
  .msg .bubble .sources {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-secondary);
  }
  .source-tag {
    display: inline-block; background: var(--bg-tertiary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; margin: 2px 4px 2px 0;
    font-size: 11px; color: var(--accent);
  }
  .msg.error .bubble { border-color: var(--red); color: #ff7b72; }

  /* ---- 空状态 ---- */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted); gap: 12px;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }
  .empty-state h3 { font-size: 16px; color: var(--text-secondary); }
  .empty-state p { font-size: 13px; }
  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .suggestion-btn {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px 16px;
    font-size: 12px; color: var(--text-secondary);
    cursor: pointer; transition: all 0.2s;
  }
  .suggestion-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(47, 129, 247, 0.05);
  }

  /* ---- 输入区 ---- */
  .input-area {
    flex-shrink: 0; padding: 14px 20px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
  }
  .input-wrapper {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px;
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within { border-color: var(--accent); }
  .input-wrapper textarea {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px;
    font-family: inherit; resize: none;
    line-height: 1.5; max-height: 120px;
  }
  .send-btn {
    width: 34px; height: 34px; flex-shrink: 0;
    border: none; border-radius: 8px;
    background: var(--accent); color: #fff;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--bg-tertiary); color: var(--text-muted); cursor: not-allowed; }

  .input-hint {
    font-size: 11px; color: var(--text-muted);
    text-align: center; margin-top: 6px;
  }

  /* ---- loading dots ---- */
  .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing-indicator span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* ---- 响应式 ---- */
  @media (max-width: 768px) {
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">R</div>
      <div>
        <h1>Mini RAG</h1>
        <div class="sub">知识库问答系统</div>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>系统状态</h2>
      <div class="status-row">
        <span class="label">知识库</span>
        <span id="kb-status" class="badge-err">未加载</span>
      </div>
      <div class="status-row">
        <span class="label">Chunk 数</span>
        <span id="chunk-count" class="value">0</span>
      </div>
      <div class="status-row">
        <span class="label">LLM</span>
        <span class="value">qwen2.5</span>
      </div>
      <div class="status-row">
        <span class="label">Embed</span>
        <span class="value">nomic-embed</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>上传文档</h2>
      <div class="upload-area" id="upload-area">
        <div class="icon">📄</div>
        <p>点击或拖拽文件至此</p>
        <div class="hint">支持 PDF / Markdown / TXT / DOCX</div>
      </div>
      <input type="file" id="file-input" multiple accept=".pdf,.md,.txt,.markdown,.docx" hidden>
    </div>

    <div class="sidebar-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <h2>知识库文档</h2>
      <div class="doc-list" id="doc-list">
        <div style="color:var(--text-muted);font-size:12px;padding:8px 0;">暂无文档</div>
      </div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <div class="topbar">
      <span class="title">💬 知识库问答</span>
      <div class="spacer"></div>
      <div class="toggle-switch">
        <span>查询改写</span>
        <div class="toggle active" id="expansion-toggle"></div>
      </div>
      <button id="clear-btn" style="background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;">清空</button>
    </div>

    <div class="chat-container" id="chat">
      <!-- 空状态 -->
      <div class="empty-state" id="empty-state">
        <div class="icon">🔍</div>
        <h3>向知识库提问</h3>
        <p>输入问题，系统将检索文档并生成带引用的回答</p>
        <div class="suggestions" id="suggestions">
          <button class="suggestion-btn">这个项目用了什么技术栈？</button>
          <button class="suggestion-btn">默认端口是多少？</button>
          <button class="suggestion-btn">有哪些核心功能？</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" placeholder="输入你的问题..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" disabled>→</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const emptyState = document.getElementById('empty-state');
const expansionToggle = document.getElementById('expansion-toggle');
const clearBtn = document.getElementById('clear-btn');

let useExpansion = true;
let isSending = false;

// ---- 初始化 ----
async function init() {
  await loadStatus();
  await loadDocuments();
}

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const badge = document.getElementById('kb-status');
    if (data.loaded) {
      badge.textContent = '已加载';
      badge.className = 'badge-ok';
    } else {
      badge.textContent = '未加载';
      badge.className = 'badge-err';
    }
    document.getElementById('chunk-count').textContent = data.chunk_count;
    sendBtn.disabled = !data.loaded;
  } catch (e) {
    console.error('status error:', e);
  }
}

async function loadDocuments() {
  try {
    const res = await fetch('/api/documents');
    const docs = await res.json();
    const list = document.getElementById('doc-list');
    if (docs.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">暂无文档</div>';
      return;
    }
    list.innerHTML = docs.map(d => {
      const icon = d.name.endsWith('.pdf') ? '📕' : d.name.endsWith('.md') ? '📝' : d.name.endsWith('.docx') ? '📘' : '📄';
      const sizeKB = (d.size / 1024).toFixed(1);
      return `<div class="doc-item">
        <span class="file-icon">${icon}</span>
        <span class="name" title="${d.name}">${d.name}</span>
        <span class="size">${sizeKB}KB</span>
        <button class="del-btn" title="删除" onclick="deleteDoc('${d.file}')">✕</button>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('documents error:', e);
  }
}

async function deleteDoc(filename) {
  const displayName = /^[0-9a-f]{8}_/.test(filename) ? filename.slice(9) : filename;
  if (!confirm(`确定从知识库删除 "${displayName}" 吗？此操作不可恢复。`)) return;

  try {
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: filename }),
    });
    const data = await res.json();
    if (data.success) {
      alert(`已删除 ${data.removed} 个 chunk`);
      loadDocuments();
      loadStatus();
    } else {
      alert('删除失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('删除请求异常: ' + e.message);
  }
}

// ---- 聊天 ----
function toggleEmptyState() {
  const hasMsgs = chat.querySelector('.msg');
  emptyState.style.display = hasMsgs ? 'none' : 'flex';
}

function addMessage(role, text, sources) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const avatarText = role === 'user' ? 'U' : 'R';
  let sourcesHtml = '';
  if (sources && sources.length > 0) {
    const tags = sources.map(s => `<span class="source-tag">${s}</span>`).join('');
    sourcesHtml = `<div class="sources">📎 来源: ${tags}</div>`;
  }
  // 简单的 markdown 代码块渲染
  const formatted = text.replace(/\n/g, '<br>');
  msg.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div class="bubble">${formatted}${sourcesHtml}</div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  toggleEmptyState();
  return msg;
}

function addTypingIndicator() {
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing-msg';
  msg.innerHTML = `
    <div class="avatar">R</div>
    <div class="bubble">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  toggleEmptyState();
  return msg;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

async function sendMessage() {
  const query = input.value.trim();
  if (!query || isSending) return;

  isSending = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', query);
  addTypingIndicator();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, use_query_expansion: useExpansion }),
    });
    const data = await res.json();

    removeTypingIndicator();

    if (data.error) {
      addMessage('error', data.error);
    } else {
      addMessage('bot', data.answer, data.sources);
    }
  } catch (e) {
    removeTypingIndicator();
    addMessage('error', `网络错误: ${e.message}`);
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ---- 事件绑定 ----
sendBtn.addEventListener('click', sendMessage);

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

expansionToggle.addEventListener('click', () => {
  useExpansion = !useExpansion;
  expansionToggle.classList.toggle('active', useExpansion);
});

clearBtn.addEventListener('click', () => {
  chat.querySelectorAll('.msg').forEach(el => el.remove());
  toggleEmptyState();
});

// 建议问题
document.getElementById('suggestions').addEventListener('click', (e) => {
  if (e.target.classList.contains('suggestion-btn')) {
    input.value = e.target.textContent;
    sendMessage();
  }
});

// ---- 文件上传 ----
const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');

uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    uploadFiles(e.dataTransfer.files);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    uploadFiles(fileInput.files);
  }
});

async function uploadFiles(files) {
  const formData = new FormData();
  for (const f of files) {
    formData.append('files', f);
  }
  // 显示上传状态
  const status = addMessage('user', `📤 上传 ${files.length} 个文件...`);
  try {
    const res = await fetch('/api/ingest', {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();
    if (data.error) {
      addMessage('error', data.error);
    } else {
      addMessage('bot', `✅ 已索引 ${data.files.length} 个文件: ${data.files.join(', ')}`);
      await loadStatus();
      await loadDocuments();
    }
  } catch (e) {
    addMessage('error', `上传失败: ${e.message}`);
  }
}

// 启动
init();
</script>
</body>
</html>
